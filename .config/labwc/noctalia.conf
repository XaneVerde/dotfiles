# window border
window.active.border.color: #9ed49d
window.inactive.border.color: #b9ccb5

# ToggleKeybinds status indicator
window.active.indicator.toggled-keybind.color: #ffb4ab

# window titlebar background
window.active.title.bg.color: #9ed49d
window.inactive.title.bg.color: #b9ccb5

window.active.label.text.color: #033912
window.inactive.label.text.color: #243424
window.label.text.justify: center

# window button hover overlay
window.button.hover.bg.color: #272b26

# window buttons
window.active.button.unpressed.image.color: #033912
window.inactive.button.unpressed.image.color: #033912

# menu
menu.border.color: #033912
menu.items.bg.color: #9ed49d
menu.items.text.color: #033912
menu.items.active.bg.color: #b9ccb5
menu.items.active.text.color: #243424
menu.separator.color: #033912
menu.title.bg.color: #9ed49d
menu.title.text.color: #033912

# on screen display (window-cycle dialog)
osd.bg.color: #9ed49d
osd.border.color: #033912
osd.label.text.color: #033912
osd.window-switcher.preview.border.color: #8c9389
