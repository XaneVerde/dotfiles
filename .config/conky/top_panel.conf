conky.config = {
    -- Window settings (Optimized for Wayland / labwc)
    own_window = true,
    own_window_type = 'panel', 
    own_window_transparent = false,
    
    -- 0.80 Transparency Level (255 * 0.80 = 204 alpha)
    own_window_bg_alpha = 204, 
    own_window_colour = '#0E1111', -- Deep charcoal base for dark wallpapers
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    
    -- Placement and sizing (Spans full screen width)
    alignment = 'top_left',
    gap_x = 0,
    gap_y = 0,
    minimum_width = 1920, -- Set this to match your monitor's exact width resolution
    minimum_height = 28,  -- Slightly taller for breathing room
    maximum_height = 28,
    
    -- Performance & Behavior
    update_interval = 2.0,
    double_buffer = true, 
    no_buffers = true,
    use_spacer = 'none',
    
    -- Text and Font settings
    use_xft = true,
    font = 'JetBrains Mono:size=10', 
    override_utf8_locale = true,
    text_buffer_size = 2048,

    -- Pure White Palette
    default_color = '#FFFFFF',      
    color1 = '#FFFFFF',             
    color2 = '#FFFFFF',             
}

conky.text = [[
${time %I:%M}\
${alignr}\
BAT: ${battery_percent}% (${battery_time}) \
]]

