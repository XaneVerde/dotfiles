conky.config = {
    -- Wayland & Window Settings
    out_to_wayland = true,
    own_window = true,
    own_window_type = 'normal',
    own_window_role = 'panel',
    own_window_class = 'Conky',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    
    -- Solid Dark Theme Colors (Catppuccin Mocha style)
    own_window_colour = '#1e1e2e',
    default_color = '#cdd6f4',
    color1 = '#a6e3a1', -- Mint Green for battery text
    
    -- Positioning (Bottom panel stretching across the screen)
    alignment = 'top_left',
    gap_x = 0,
    gap_y = 0,
    minimum_width = 1920, -- Set this to match your monitor width if it doesn't auto-stretch
    minimum_height = 26,
    maximum_height = 26,
    
    -- Performance & Behavior
    update_interval = 2.0,
    double_buffer = true,
    no_buffers = true,
    use_spacer = 'none',
    
    -- Typography
    use_xft = true,
    font = 'MesloLGL Nerd Font Mono:size=16',
}

conky.text = [[
${goto 15}${execi 3600 printf '\uF017'}  ${time %I:%M}${alignr}${color1}${execi 10 printf '\uF240'}  ${battery_percent BAT0}% (${battery_status BAT0}) ${color}
]]

