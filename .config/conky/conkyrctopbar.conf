conky.config = {
    -- Text settings
    use_xft = true,
    font = 'Monospace:size=18', -- Lowered baseline font size here
    
    -- Conky settings
    xftalpha = 0.9,
    update_interval = 1,
    net_avg_samples = 1,
    cpu_avg_samples = 1,
    total_run_times = 0,
    double_buffer = true,
    
    -- Window specifications (Wayland Adaptive)
    alignment = 'top_left',
    gap_x = 5,
    gap_y = 5,
    own_window = true,
    own_window_type = 'conky-edp'
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    
    -- Graphics settings
    draw_shades = false,
    default_color = 'white',
    default_shade_color = 'red',
    color1 = 'blue',
};

conky.text = [[
${font Monospace:bold:size=18}${color}${font}${color1}  ${time %I:%M}\
${font Monospace:bold:size=18}${color} CPU1: ${font}${color1}${cpu cpu1}%\
${font Monospace:bold:size=18}${color} CPU2: ${font}${color1}${cpu cpu2}%\
${font Monospace:bold:size=18}${color} RAM: ${font}${color1}${memperc}%\
${font Monospace:bold:size=18}${color}(${font}${color1}${mem}${font Monospace:bold:size=18}${color}/${font}${color1}${memmax}${font Monospace:bold:size=18}${color})\
${font Monospace:bold:size=18}${color}                                      Root: ${font}${color1}${fs_used_perc /}%\
${font Monospace:bold:size=18}${color}(${font}${color1}${fs_used /}${font Monospace:bold:size=18}${color}/${font}${color1}${fs_size /}${font Monospace:bold:size=18}${color})\
${if_up wlp6s0}\
${font Monospace:bold:size=18}${color} Down: ${font}${color1}${downspeed wlp6s0}\
${font Monospace:bold:size=18}${color} Up: ${font}${color1}${upspeed wlp6s0}\
${font Monospace:bold:size=18}${color} Signal: ${font}${color1}${exec nmcli -f IN-USE,SIGNAL device wifi | awk '/^\*/ {print $2}'}%\
${color} ${downspeedgraph wlp6s0 8,60 82B6F1 CCDFFF}\
${else}\
${if_up enp2s0}\
${font Monospace:bold:size=18}${color} Down: ${font}${color1}${downspeed enp2s0}\
${font Monospace:bold:size=18}${color} Up: ${font}${color1}${upspeed enp2s0}\
${downspeedgraph enp2s0 8,60 82B6F1 CCDFFF}\
${endif}\
${endif}\
${font Monospace:bold:size=18}${color} Bat: ${font}${color1}${battery_percent}%(${battery_status})\
]]

