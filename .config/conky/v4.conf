conky.config = {
    -- Top Bar Positioning
    alignment = 'top_left',
    gap_x = 0,
    gap_y = 0,
    minimum_width = 1920,      -- Change this to match your monitor width in pixels
    maximum_width = 1920,      -- Change this to match your monitor width in pixels
    minimum_height = 30,       -- Bar height

    -- Window settings
    background = true,
    double_buffer = true,
    own_window = true,
    out_to_wayland = true,
    out_to_x =false,
    own_window_class = 'Conky',
    own_window_type = 'desktop', -- Set as 'panel' to act natively like a top bar
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 180,  -- Slight semi-transparency (0=clear, 255=opaque)
    own_window_colour = '#1e2d24',-- Dark background bar color (Catppuccin Mocha theme)
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    -- Renderer settings
    draw_borders = false,
    draw_shades = false,
    draw_outline = false,
    use_xft = true,
    font = 'MesloLGL Nerd Font:size=16', -- Default fallback text font
    text_buffer_size = 2048,
    update_interval = 2.0,
    default_color = '#cdd6f4',   -- Light text color
}

conky.text = [[
${voffset 6}\
# LEFT ALIGNED: Clock and Date
${goto 15}${font MesloLGL Nerd Font:size=16} ${font}${time %I:%M}\
# RIGHT ALIGNED: Battery Info (Uses clean single-letter status to prevent overlapping text)
${goto 1750}${font MesloLGL Nerd Font:size=16} ${font}${battery_percent}%[${battery_short}]\
]]

