conky.config = {
    -- Window settings (Fixed transparency structure for Wayland / labwc)
    own_window = true,
    own_window_type = 'panel', 
    own_window_transparent = false,
    own_window_argb_visual = true,   -- FORCES ALPHA LAYER UNDER WAYLAND
    own_window_argb_value = 204,     -- 80% Translucent (0-255 scale)
    own_window_colour = '#0E1111', 
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    
    -- Placement and sizing
    alignment = 'top_left',
    gap_x = 0,
    gap_y = 0,
    minimum_width = 1920, 
    minimum_height = 28,  
    maximum_height = 28,
    
    -- Performance & Behavior
    update_interval = 2.0,
    double_buffer = true, 
    no_buffers = true,
    use_spacer = 'none',
    
    -- Text and Font settings
    use_xft = true,
    font = 'MesloLGS NF:size=10', 
    override_utf8_locale = true,
    text_buffer_size = 2048,

    -- Pure White Palette
    default_color = '#FFFFFF',      
    color1 = '#FFFFFF',             
    color2 = '#FFFFFF',             
}

conky.text = [[
${font MesloLGS NF:size=11}${execi 3600 echo -e '\uF017'}${font}  ${time %H:%M}\
${alignr}\
${font MesloLGS NF:size=11}${execi 10 echo -e '\uF240'}${font}  ${battery_percent}% (${battery_time}) \
]]

