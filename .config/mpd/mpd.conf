music_directory    "/home/xane/Music"
playlist_directory "/home/xane/.local/share/mpd/playlists"
db_file            "/home/xane/.local/share/mpd/database"
log_file           "syslog"
pid_file           "/home/xane/.local/share/mpd/pid"
state_file         "/home/xane/.local/share/mpd/state"
sticker_file       "/home/xane/.local/share/mpd/sticker.sql"

auto_update "yes"
bind_to_address "127.0.0.1"
bind_to_address "~/.config/mpd/socket"
restore_paused "yes"

# Audio Output (Standard PulseAudio / PipeWire-Pulse translation)
audio_output {
        type            "pipewire"
        name            "PipeWire Sound Server"
}

# Visualizer Output (For ncmpcpp's audio visualizer if you want it)
audio_output {
    type                    "fifo"
    name                    "my_fifo"
    path                    "/tmp/mpd.fifo"
    format                  "44100:16:2"
}

